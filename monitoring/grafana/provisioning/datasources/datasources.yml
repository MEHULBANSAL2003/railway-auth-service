# ============================================
# GRAFANA DATASOURCES CONFIGURATION
# ============================================
# Auto-configures data sources in Grafana
# No need to manually add them in UI
# Grafana reads this on startup
# ============================================

# API version (always use 1)
apiVersion: 1

# Delete datasources from database that are not in this file
# false = Keep existing datasources (safer)
# true = Remove datasources not defined here
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1

# ============================================
# DATASOURCES LIST
# ============================================
datasources:

  # ------------------------------------------
  # DATASOURCE 1: Prometheus (Metrics)
  # ------------------------------------------
  - name: Prometheus
    # Type of datasource
    type: prometheus

    # Access mode:
    # - proxy: Grafana backend proxies requests (recommended)
    # - direct: Browser makes direct requests (CORS issues)
    access: proxy

    # Organization ID (1 = default org)
    orgId: 1

    # URL to Prometheus
    # Use service name from docker-compose.yml
    url: http://prometheus:9090

    # Basic auth (disabled)
    basicAuth: false

    # Is this the default datasource?
    # true = Pre-selected in query editor
    isDefault: true

    # Version (leave as 1)
    version: 1

    # Editable in Grafana UI
    # false = Cannot be modified/deleted in UI (safer)
    editable: false

    # JSON data (additional settings)
    jsonData:
      # HTTP method for queries (GET or POST)
      httpMethod: POST

      # Query timeout
      timeout: 60

      # Time interval options in query editor
      timeInterval: "15s"

      # Custom query parameters (optional)
      # customQueryParameters: ""

      # TLS settings (not needed for internal network)
      tlsSkipVerify: false

  # ------------------------------------------
  # DATASOURCE 2: Loki (Logs)
  # ------------------------------------------
  - name: Loki
    # Type of datasource
    type: loki

    # Access mode: proxy (Grafana backend proxies)
    access: proxy

    # Organization ID
    orgId: 1

    # URL to Loki
    # Use service name from docker-compose.yml
    url: http://loki:3100

    # Basic auth (disabled)
    basicAuth: false

    # Not the default (Prometheus is default)
    isDefault: false

    # Version
    version: 1

    # Editable in UI
    editable: false

    # JSON data (additional settings)
    jsonData:
      # Max number of lines to return
      maxLines: 1000

      # Derived fields (extract values from logs)
      # Example: Extract trace IDs and link to Jaeger
      derivedFields:
        # Extract trace ID from logs
        - datasourceUid: prometheus  # Can link to other datasources
          matcherRegex: "traceID=(\\w+)"
          name: TraceID
          url: ""  # URL template (e.g., Jaeger URL)

        # Extract request ID
        - datasourceUid: loki
          matcherRegex: "requestId=(\\w+)"
          name: RequestID
          url: ""

      # Timeout for queries
      timeout: 60

      # TLS settings
      tlsSkipVerify: false

# ============================================
# IMPORTANT NOTES FOR DEVELOPERS
# ============================================
#
# 1. AUTOMATIC PROVISIONING:
#    - This file is read when Grafana starts
#    - Datasources are created automatically
#    - No manual configuration needed
#    - Grafana must restart to pick up changes
#
# 2. DATASOURCE URLS:
#    - Use Docker service names: prometheus, loki
#    - These work because all containers are in same network
#    - Don't use localhost (won't work inside container)
#
# 3. DEFAULT DATASOURCE:
#    - isDefault: true means it's pre-selected
#    - Only ONE datasource should be default
#    - Here: Prometheus is default (used more often)
#
# 4. EDITABLE SETTING:
#    - editable: false = Cannot modify in UI
#    - Prevents accidental changes
#    - To modify: Change this file and restart Grafana
#
# 5. ACCESS MODES:
#    - proxy: Grafana backend makes requests (recommended)
#      Pros: No CORS issues, can add auth headers
#      Cons: Goes through Grafana (slight overhead)
#    - direct: Browser makes requests directly
#      Pros: Faster (no proxy)
#      Cons: CORS issues, exposes datasource URL to browser
#
# 6. DERIVED FIELDS (Loki):
#    - Extract values from log messages
#    - Create clickable links
#    - Example: Click trace ID to jump to Jaeger
#    - Regex must match your log format
#
# 7. TESTING DATASOURCES:
#    - Grafana UI → Configuration → Data Sources
#    - Click datasource name
#    - Click "Test" button
#    - Should see "Data source is working"
#
# 8. TROUBLESHOOTING:
#    - Datasources not appearing?
#      a) Check Grafana logs: docker logs grafana
#      b) Verify file is in correct location
#      c) Check YAML syntax (use yamllint)
#      d) Restart Grafana: docker-compose restart grafana
#
#    - Test failing?
#      a) Check Prometheus/Loki are running
#      b) Check URL is correct (use service name)
#      c) Check network: docker network inspect monitoring_monitoring
#      d) Try curl from Grafana container:
#         docker exec grafana curl http://prometheus:9090/-/healthy
#
# 9. ADDING MORE DATASOURCES:
#    - Copy existing block
#    - Change name, type, url
#    - Supported types:
#      - prometheus, loki, elasticsearch, mysql, postgres
#      - influxdb, graphite, cloudwatch, and many more
#    - Restart Grafana after changes
#
# 10. ORGANIZATIONS:
#     - orgId: 1 is the default organization
#     - Multi-tenant setups can have multiple orgs
#     - Each org can have different datasources
#     - For simple setups, always use orgId: 1
#
# ============================================

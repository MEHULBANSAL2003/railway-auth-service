# ============================================
# GRAFANA DASHBOARDS PROVISIONING
# ============================================
# Tells Grafana where to find dashboard JSON files
# Dashboards are automatically loaded on startup
# ============================================

# API version (always use 1)
apiVersion: 1

# ============================================
# DASHBOARD PROVIDERS
# ============================================
# Define where Grafana should look for dashboard files
providers:

  # Provider 1: Default dashboards
  - name: 'default'
    # Organization ID
    orgId: 1

    # Folder name in Grafana UI
    # All dashboards from this provider go in this folder
    folder: 'General'

    # Type: file = Load from filesystem
    type: file

    # Disable dashboard deletion in UI
    # true = Cannot delete in UI (safer)
    # false = Can delete in UI
    disableDeletion: false

    # Update imported dashboards
    # true = Reload if file changes
    # false = Only load once
    updateIntervalSeconds: 10

    # Allow dashboard editing in UI
    # true = Can edit and save in UI
    # false = Read-only (edit file instead)
    allowUiUpdates: true

    # Options for file provider
    options:
      # Path to dashboard JSON files
      # This is the path INSIDE the Grafana container
      # Mapped in docker-compose.yml:
      #   - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      path: /etc/grafana/provisioning/dashboards

      # Watch for file changes
      # true = Automatically reload when files change
      foldersFromFilesStructure: true

# ============================================
# DASHBOARD FILES TO CREATE
# ============================================
# Create these JSON files in the same directory:
#
# 1. spring-boot.json
#    - Spring Boot application dashboard
#    - JVM metrics, HTTP metrics, etc.
#
# 2. loki-logs.json (optional)
#    - Log exploration dashboard
#    - Search and filter logs
#
# 3. custom-metrics.json (create your own)
#    - Business metrics
#    - Custom application metrics
#
# ============================================

# ============================================
# IMPORTANT NOTES FOR DEVELOPERS
# ============================================
#
# 1. DASHBOARD JSON FILES:
#    - Place in same directory as this file
#    - Must be valid JSON
#    - Can export from Grafana UI: Share → Export
#    - Or download from https://grafana.com/grafana/dashboards/
#
# 2. AUTO-LOADING:
#    - Dashboards load when Grafana starts
#    - Or after updateIntervalSeconds (10s)
#    - No need to manually import
#
# 3. FOLDER ORGANIZATION:
#    - folder: 'General' = All dashboards go in "General" folder
#    - Can create multiple providers with different folders:
#       - folder: 'Spring Boot' for app dashboards
#       - folder: 'Infrastructure' for system dashboards
#
# 4. EDITING DASHBOARDS:
#    - allowUiUpdates: true = Can edit in UI
#    - Changes in UI are NOT saved to file
#    - To persist: Export JSON and replace file
#    - Or set allowUiUpdates: false for read-only
#
# 5. DASHBOARD IDS:
#    - Each dashboard has unique ID in JSON
#    - Set "id": null for auto-generation
#    - Or use specific ID: "id": 1234
#
# 6. DATASOURCE REFERENCES:
#    - Dashboards reference datasources by name or UID
#    - Use datasource name: "Prometheus", "Loki"
#    - Or use UID for stability (doesn't change)
#
# 7. VARIABLES:
#    - Dashboards can have variables (dropdowns)
#    - Example: $environment, $service, $instance
#    - Variables make dashboards dynamic
#
# 8. IMPORTING DASHBOARDS:
#    - Find dashboards: https://grafana.com/grafana/dashboards/
#    - Popular Spring Boot dashboard: 12900, 11378, 4701
#    - Download JSON
#    - Place in this directory
#    - Grafana loads automatically
#
# 9. CREATING CUSTOM DASHBOARDS:
#    - Create in Grafana UI
#    - Share → Export → Save JSON
#    - Copy JSON to this directory
#    - Edit datasource references if needed
#
# 10. TROUBLESHOOTING:
#     - Dashboards not loading?
#       a) Check Grafana logs: docker logs grafana
#       b) Verify JSON is valid (use jsonlint.com)
#       c) Check file permissions
#       d) Check path in docker-compose.yml volume mount
#
#     - Dashboard showing "No data"?
#       a) Check datasource is configured
#       b) Check queries are correct
#       c) Verify data exists in Prometheus/Loki
#       d) Check time range in dashboard
#
# ============================================

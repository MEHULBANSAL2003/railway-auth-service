# ============================================
# LOKI CONFIGURATION
# ============================================
# Loki is a log aggregation system
# This config defines:
# - How Loki stores logs
# - How long to retain logs
# - Performance settings
# ============================================

# Authentication (disabled for development)
# In production, enable authentication
auth_enabled: false

# ============================================
# SERVER CONFIGURATION
# ============================================
server:
  # HTTP listen port
  http_listen_port: 3100

  # gRPC listen port (for internal communication)
  grpc_listen_port: 9096

  # Log level: debug, info, warn, error
  log_level: info

# ============================================
# INGESTER CONFIGURATION
# ============================================
# Ingester receives logs from Promtail and writes to storage
ingester:
  # Lifecycler manages ingester's lifecycle in the ring
  lifecycler:
    # Ring configuration (for distributed setup)
    ring:
      # Key-value store for ring membership
      kvstore:
        store: inmemory  # Use in-memory store (single instance)

      # Replication factor: How many copies of data
      replication_factor: 1  # 1 = single instance, no replication

  # Chunk configuration
  # Logs are grouped into "chunks" before writing to storage
  chunk_idle_period: 5m       # Flush chunk after 5 min of inactivity
  chunk_block_size: 262144    # 256KB chunks
  chunk_retain_period: 30s    # Keep chunks in memory for 30s

  # Max transfer retries when flushing chunks
  max_transfer_retries: 0

  # WAL (Write-Ahead Log) configuration
  # WAL prevents data loss if Loki crashes
  wal:
    enabled: true
    dir: /loki/wal
    checkpoint_duration: 5m
    flush_on_shutdown: true

# ============================================
# SCHEMA CONFIGURATION
# ============================================
# Defines how Loki stores and indexes logs
schema_config:
  configs:
    # Schema version (v11 is current stable)
    - from: 2020-10-24

      # Store: Where to save data
      store: boltdb-shipper

      # Object store: Where to store chunks
      object_store: filesystem

      # Schema: Index schema version
      schema: v11

      # Index configuration
      index:
        # Prefix for index files
        prefix: index_

        # How often to create new index tables
        # 24h = One index table per day
        period: 24h

# ============================================
# STORAGE CONFIGURATION
# ============================================
storage_config:
  # BoltDB Shipper: Efficient single-binary deployment
  boltdb_shipper:
    # Active index directory (currently being written)
    active_index_directory: /loki/boltdb-shipper-active

    # Cache directory (recently accessed indices)
    cache_location: /loki/boltdb-shipper-cache

    # TTL for cached indices
    cache_ttl: 24h

    # Shared store directory (final storage location)
    shared_store: filesystem

  # Filesystem storage configuration
  filesystem:
    # Directory where chunks are stored
    directory: /loki/chunks

# ============================================
# COMPACTOR CONFIGURATION
# ============================================
# Compactor merges small index files into larger ones
# Improves query performance and reduces storage
compactor:
  # Working directory for compaction
  working_directory: /loki/boltdb-shipper-compactor

  # Shared store (same as storage_config)
  shared_store: filesystem

  # Compaction interval: How often to run
  compaction_interval: 10m

  # Retention settings (see limits_config below)
  retention_enabled: true

  # Delete old chunks after retention period
  retention_delete_delay: 2h

  # How long to keep deleted data before permanent deletion
  retention_delete_worker_count: 150

# ============================================
# LIMITS CONFIGURATION
# ============================================
# Rate limits and retention policies
limits_config:
  # Reject logs older than this
  # Prevents ingesting very old logs
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # 7 days

  # Ingestion rate limit per stream
  # 0 = unlimited (use with caution in production)
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20

  # Max concurrent queries per tenant
  max_concurrent_tail_requests: 10

  # Query timeout
  query_timeout: 1m

  # Max query length (time range)
  max_query_length: 721h  # ~30 days

  # Max query lookback period
  max_query_lookback: 0  # 0 = unlimited

  # Retention period: How long to keep logs
  # After this period, logs are deleted
  retention_period: 744h  # 31 days (24h * 31)

  # Max streams per user/tenant
  # Prevents creating too many unique label combinations
  max_streams_per_user: 0  # 0 = unlimited

  # Max label name length
  max_label_name_length: 1024

  # Max label value length
  max_label_value_length: 2048

  # Max label names per series
  max_label_names_per_series: 30

# ============================================
# CHUNK STORE CONFIGURATION
# ============================================
chunk_store_config:
  # Max query concurrency
  max_look_back_period: 0

  # Chunk cache configuration (optional)
  # Uncomment to enable caching for better performance
  # chunk_cache_config:
  #   enable_fifocache: true
  #   fifocache:
  #     max_size_mb: 1024
  #     ttl: 24h

# ============================================
# TABLE MANAGER CONFIGURATION
# ============================================
# Manages index and chunk tables
table_manager:
  # Retention settings
  retention_deletes_enabled: true
  retention_period: 744h  # 31 days

# ============================================
# QUERY FRONTEND CONFIGURATION (Optional)
# ============================================
# Improves query performance by caching and splitting
# Uncomment to enable
# frontend:
#   compress_responses: true
#   max_outstanding_per_tenant: 256
#   log_queries_longer_than: 5s

# ============================================
# RULER CONFIGURATION (Optional)
# ============================================
# For alerting based on log patterns
# Uncomment when you need alerts
# ruler:
#   storage:
#     type: local
#     local:
#       directory: /loki/rules
#   rule_path: /loki/rules-temp
#   alertmanager_url: http://alertmanager:9093
#   ring:
#     kvstore:
#       store: inmemory
#   enable_api: true

# ============================================
# IMPORTANT NOTES FOR DEVELOPERS
# ============================================
#
# 1. DATA PERSISTENCE:
#    - All data stored in /loki directory
#    - Mapped to Docker volume in docker-compose.yml
#    - Data survives container restarts
#
# 2. RETENTION POLICY:
#    - Current: 31 days (744h)
#    - Logs older than 31 days are automatically deleted
#    - Adjust based on compliance/debugging needs
#    - Formula: retention_period = hours × days
#
# 3. STORAGE ESTIMATION:
#    - Depends on log volume
#    - Example: 100 MB/day × 31 days = ~3 GB
#    - Monitor disk usage regularly
#
# 4. PERFORMANCE TUNING:
#    - chunk_idle_period: Lower = more frequent writes
#    - ingestion_rate_mb: Limit per-stream ingestion
#    - max_query_length: Limit query time range
#
# 5. QUERYING LOGS:
#    - Use LogQL (Loki Query Language)
#    - Examples in Grafana:
#      {app="railway-auth-service"}
#      {app="railway-auth-service"} |= "error"
#      {app="railway-auth-service", level="ERROR"}
#
# 6. TROUBLESHOOTING:
#    - Check Loki logs: docker logs loki
#    - Verify /loki directory has write permissions
#    - Check Loki health: curl http://localhost:3100/ready
#
# 7. UPGRADING:
#    - When upgrading Loki version, check migration guide
#    - Schema changes might require re-indexing
#    - Always backup /loki directory before upgrade
#
# ============================================

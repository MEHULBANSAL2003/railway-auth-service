server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml
  sync_period: 10s

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576
    timeout: 10s
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10
    external_labels:
      cluster: 'local'
      environment: 'dev'

scrape_configs:
  - job_name: railway-auth-service
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\S+\s+\S+)\s+\[(?P<thread>.*?)\]\s+(?P<level>\S+)\s+(?P<logger>\S+)\s+-\s+(?P<message>.*)$'
      - labels:
          level:
          logger:
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05.000'
          location: 'Asia/Kolkata'
      - output:
          source: message
    static_configs:
      - targets:
          - localhost
        labels:
          job: railway-auth-service
          environment: dev
          __path__: /logs/dev/*.log
      - targets:
          - localhost
        labels:
          job: railway-auth-service
          environment: prod
          __path__: /logs/prod/*.log

# ============================================
# PROMETHEUS CONFIGURATION
# ============================================
# Defines:
# - Where to scrape metrics from (targets)
# - How often to scrape
# - What labels to add
# - Alerting rules (optional)
# ============================================

# Global configuration applies to all jobs unless overridden
global:
  # scrape_interval: How often Prometheus scrapes targets
  # 15s = Every 15 seconds, Prometheus pulls metrics
  # Trade-off: Lower = more data + CPU, Higher = less granular data
  scrape_interval: 15s

  # evaluation_interval: How often to evaluate alerting rules
  # 15s = Check alert conditions every 15 seconds
  evaluation_interval: 15s

  # scrape_timeout: Max time to wait for scrape response
  # If target doesn't respond in 10s, mark as failed
  scrape_timeout: 10s

  # external_labels: Labels added to all metrics
  # Useful for identifying Prometheus instance in federation
  external_labels:
    monitor: 'railway-auth-monitor'
    environment: 'development'

# ============================================
# ALERTING CONFIGURATION (Optional)
# ============================================
# Configure where to send alerts (Alertmanager)
# Commented out for now - uncomment when you set up alerting
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - 'alertmanager:9093'

# ============================================
# RULE FILES (Optional)
# ============================================
# Load alerting and recording rules from files
# Commented out for now - uncomment when you create rule files
# rule_files:
#   - '/etc/prometheus/alerts/*.yml'
#   - '/etc/prometheus/rules/*.yml'

# ============================================
# SCRAPE CONFIGURATIONS
# ============================================
# Define what targets to scrape and how

scrape_configs:

  # ------------------------------------------
  # JOB 1: Prometheus Self-Monitoring
  # ------------------------------------------
  # Prometheus scrapes its own /metrics endpoint
  # Useful for monitoring Prometheus itself
  - job_name: 'prometheus'

    # How often to scrape (overrides global)
    scrape_interval: 15s

    # Targets to scrape
    static_configs:
      - targets:
          # localhost:9090 = Prometheus itself
          - 'localhost:9090'

        # Labels added to all metrics from this target
        labels:
          service: 'prometheus'
          team: 'platform'

  # ------------------------------------------
  # JOB 2: Spring Boot Application
  # ------------------------------------------
  # Scrape your Railway Auth Service
  - job_name: 'railway-auth-service'

    # Scrape more frequently for your main app
    scrape_interval: 10s

    # Path to scrape (default is /metrics)
    # Spring Boot Actuator exposes at /actuator/prometheus
    metrics_path: '/actuator/prometheus'

    # Targets to scrape
    static_configs:
      - targets:
          # IMPORTANT: Replace with your actual host
          #
          # If Spring Boot runs on HOST (not Docker):
          #   - 'host.docker.internal:8080'  (Mac/Windows)
          #   - '172.17.0.1:8080'             (Linux)
          #
          # If Spring Boot runs in SAME Docker network:
          #   - 'railway-auth-service:8080'
          #
          # For now, use host.docker.internal (works on Mac/Windows)
          - 'host.docker.internal:8080'

        # Labels added to metrics from this target
        labels:
          application: 'railway-auth-service'
          environment: 'dev'
          team: 'backend'

    # Relabel configurations (advanced)
    # Modify labels before storing metrics
    relabel_configs:
    # Keep only targets that are UP
    # __meta_consul_health: health status from service discovery
    # This example is for Consul, can be removed if not using
    # - source_labels: [__meta_consul_health]
    #   regex: passing
    #   action: keep

  # ------------------------------------------
  # JOB 3: Loki Metrics
  # ------------------------------------------
  # Monitor Loki itself
  - job_name: 'loki'
    scrape_interval: 15s
    static_configs:
      - targets:
          # Loki container exposes metrics at port 3100
          - 'loki:3100'
        labels:
          service: 'loki'

  # ------------------------------------------
  # JOB 4: Promtail Metrics
  # ------------------------------------------
  # Monitor Promtail itself
  - job_name: 'promtail'
    scrape_interval: 15s
    static_configs:
      - targets:
          # Promtail exposes metrics at port 9080
          - 'promtail:9080'
        labels:
          service: 'promtail'

  # ------------------------------------------
  # JOB 5: Grafana Metrics
  # ------------------------------------------
  # Monitor Grafana itself
  - job_name: 'grafana'
    scrape_interval: 15s
    static_configs:
      - targets:
          # Grafana exposes metrics at port 3000
          - 'grafana:3000'
        labels:
          service: 'grafana'


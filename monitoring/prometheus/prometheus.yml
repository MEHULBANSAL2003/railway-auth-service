# ============================================
# IMPORTANT NOTES FOR DEVELOPERS
# ============================================
#
# 1. DOCKER NETWORKING:
#    - Service names work within Docker network (loki, promtail)
#    - For host machine: use 'host.docker.internal' (Mac/Windows)
#    - For host machine: use '172.17.0.1' (Linux)
#
# 2. TESTING SCRAPES:
#    - Go to Prometheus UI: http://localhost:9090
#    - Status → Targets
#    - Check if targets are UP (green)
#    - If DOWN, check:
#      a) Is Spring Boot running?
#      b) Is /actuator/prometheus accessible?
#      c) Is network configuration correct?
#
# 3. QUERYING METRICS:
#    - Prometheus UI → Graph
#    - Try queries:
#      - http_server_requests_seconds_count
#      - rate(http_server_requests_seconds_count[5m])
#      - jvm_memory_used_bytes
#
# 4. RELOADING CONFIG:
#    - After changing this file:
#      curl -X POST http://localhost:9090/-/reload
#    - Or restart: docker-compose restart prometheus
#
# 5. DATA RETENTION:
#    - Set in docker-compose.yml: --storage.tsdb.retention.time=30d
#    - After 30 days, old metrics are deleted
#    - Adjust based on disk space and needs
#
# ============================================

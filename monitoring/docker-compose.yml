# ============================================
# MONITORING STACK DOCKER COMPOSE
# ============================================
# This file defines all monitoring services:
# - Prometheus: Metrics collection & storage
# - Loki: Log aggregation & storage
# - Promtail: Log shipping agent
# - Grafana: Visualization & dashboards
# ============================================

version: '3.8'

# ============================================
# NETWORKS
# ============================================
# Create a dedicated network for monitoring stack
# All services can communicate with each other using service names
networks:
  monitoring:
    driver: bridge
    # bridge: Default network type, creates virtual network

# ============================================
# VOLUMES
# ============================================
# Named volumes for persistent data storage
# Data persists even when containers are stopped/removed
volumes:
  prometheus_data:
  # Stores Prometheus metrics database
  loki_data:
  # Stores Loki log database
  grafana_data:
  # Stores Grafana dashboards, users, settings

# ============================================
# SERVICES
# ============================================
services:

  # ------------------------------------------
  # PROMETHEUS - Metrics Database
  # ------------------------------------------
  prometheus:
    # Docker image: Official Prometheus image, version v2.48.1
    image: prom/prometheus:v2.48.1

    # Container name (easier to reference than auto-generated name)
    container_name: prometheus

    # Restart policy: Always restart if container stops
    # Ensures service stays up even after system reboot
    restart: unless-stopped

    # Port mapping: host_port:container_port
    # Access Prometheus UI at http://localhost:9090
    ports:
      - "9090:9090"

    # Volume mounts: Map host directories/files into container
    volumes:
      # Config file: prometheus.yml from host → /etc/prometheus/ in container
      # :ro = read-only (container cannot modify host file)
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

      # Data persistence: prometheus_data volume → /prometheus in container
      # Stores all metrics data (survives container restarts)
      - prometheus_data:/prometheus

    # Command to run when container starts
    # Overrides default Prometheus command
    command:
      # --config.file: Path to config file inside container
      - '--config.file=/etc/prometheus/prometheus.yml'

      # --storage.tsdb.path: Where to store metrics database
      - '--storage.tsdb.path=/prometheus'

      # --storage.tsdb.retention.time: How long to keep metrics
      # 30d = 30 days, after that old data is deleted
      - '--storage.tsdb.retention.time=30d'

      # --web.console.libraries: Path to console libraries
      - '--web.console.libraries=/etc/prometheus/console_libraries'

      # --web.console.templates: Path to console templates
      - '--web.console.templates=/etc/prometheus/consoles'

      # --web.enable-lifecycle: Enable /-/reload endpoint
      # Allows reloading config without restarting container
      - '--web.enable-lifecycle'

    # Connect to monitoring network
    networks:
      - monitoring

    # Health check: Docker checks if service is healthy
    healthcheck:
      # Command to check health
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      # How long to wait before first check
      interval: 30s
      # How long to wait for response
      timeout: 10s
      # How many failures before marking unhealthy
      retries: 3
      # How long to wait before starting health checks
      start_period: 40s

  # ------------------------------------------
  # LOKI - Log Aggregation System
  # ------------------------------------------
  loki:
    image: grafana/loki:2.9.3
    container_name: loki
    restart: unless-stopped

    # Port 3100: Loki API endpoint
    # Promtail sends logs here
    # Grafana queries logs from here
    ports:
      - "3100:3100"

    volumes:
      # Loki configuration file
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro

      # Data persistence: Store log chunks
      - loki_data:/loki

    command:
      # -config.file: Path to Loki config
      - '-config.file=/etc/loki/loki-config.yml'

    networks:
      - monitoring

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ------------------------------------------
  # PROMTAIL - Log Shipping Agent
  # ------------------------------------------
  promtail:
    image: grafana/promtail:2.9.3
    container_name: promtail
    restart: unless-stopped

    # Port 9080: Promtail metrics endpoint
    # Can scrape Promtail's own metrics
    ports:
      - "9080:9080"

    volumes:
      # Promtail configuration
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro

      # IMPORTANT: Mount log directory from host
      # This allows Promtail to read logs created by your Spring Boot app
      # Adjust path to match where your app writes logs
      # Format: /absolute/path/on/host:/path/in/container:ro
      - ../logs:/logs:ro

      # Mount Docker socket (optional, for container logs)
      # Allows Promtail to collect logs from other Docker containers
      - /var/run/docker.sock:/var/run/docker.sock:ro

    command:
      # -config.file: Path to Promtail config
      - '-config.file=/etc/promtail/promtail-config.yml'

    networks:
      - monitoring

    # depends_on: Start Loki before Promtail
    # Ensures Loki is ready to receive logs
    depends_on:
      - loki

  # ------------------------------------------
  # GRAFANA - Visualization & Dashboards
  # ------------------------------------------
  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    restart: unless-stopped

    # Port 3000: Grafana web UI
    # Access at http://localhost:3000
    # Default login: admin/admin
    ports:
      - "3000:3000"

    # Environment variables for Grafana configuration
    environment:
      # Disable login page, auto-login as admin (DEV ONLY!)
      # NEVER use in production
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin

      # Or use default admin credentials (PRODUCTION)
      # - GF_SECURITY_ADMIN_USER=admin
      # - GF_SECURITY_ADMIN_PASSWORD=your_secure_password_here

      # Server settings
      - GF_SERVER_ROOT_URL=http://localhost:3000

      # Enable provisioning (auto-configure datasources & dashboards)
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning

    volumes:
      # Data persistence: Dashboards, users, settings
      - grafana_data:/var/lib/grafana

      # Provisioning: Auto-configure datasources
      # Maps host directory → /etc/grafana/provisioning/datasources
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro

      # Provisioning: Auto-configure dashboards
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro

    networks:
      - monitoring

    # Start Grafana after Prometheus and Loki are ready
    depends_on:
      - prometheus
      - loki

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ============================================
# USAGE INSTRUCTIONS
# ============================================
#
# START ALL SERVICES:
#   cd monitoring
#   docker-compose up -d
#
# VIEW LOGS:
#   docker-compose logs -f [service_name]
#   Example: docker-compose logs -f prometheus
#
# STOP ALL SERVICES:
#   docker-compose down
#
# STOP AND REMOVE DATA:
#   docker-compose down -v
#
# RESTART SINGLE SERVICE:
#   docker-compose restart prometheus
#
# ACCESS SERVICES:
#   - Prometheus: http://localhost:9090
#   - Loki: http://localhost:3100 (API only, no UI)
#   - Promtail: http://localhost:9080/metrics
#   - Grafana: http://localhost:3000 (login: admin/admin)
#
# ============================================

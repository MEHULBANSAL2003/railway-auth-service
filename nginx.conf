# ── Rate limiting zones ──────────────────────────────────
# A zone is a shared memory area where Nginx tracks
# how many requests each IP address has made.
#
# $binary_remote_addr = the client's IP address in binary
# format. Binary takes less memory than string format.
# Allows storing more IPs in the same memory space.
#
# zone=strict:10m = name this zone "strict", give it 10MB.
# 10MB can track ~160,000 unique IP addresses simultaneously.
#
# rate=5r/s = maximum 5 requests per second per IP.
# This zone is for sensitive endpoints — login, OTP verify.
limit_req_zone $binary_remote_addr zone=strict:10m rate=5r/s;

# Normal zone — for all other auth endpoints.
# 30 requests per second per IP is generous for normal usage.
limit_req_zone $binary_remote_addr zone=normal:10m rate=30r/s;


# ── Upstream ─────────────────────────────────────────────
# Gives a name to your auth-service container.
# "auth-service" is the container name defined in
# docker-compose.yml. Docker resolves this name to the
# correct container IP on the internal network.
# Port 8080 is what Spring Boot listens on inside container.
upstream auth_service {
    server auth-service:8080;

    # keepalive 32 = maintain a pool of 32 persistent
    # connections to auth-service.
    # WHY? Without this, every request opens a new TCP
    # connection to Spring Boot — expensive and slow.
    # With this, connections are reused from the pool.
    keepalive 32;
}


server {
    listen 80;

    # NGINX_SERVER_NAME is an environment variable.
    # Dev:  dev.api.railtick.in
    # Prod: api.railtick.in
    # Same nginx.conf works for both environments.
    # The value gets injected by Docker Compose.
    server_name ${NGINX_SERVER_NAME};

    # ── Compression ──────────────────────────────────────
    # Compress responses before sending to client.
    # JSON compresses 70-80%. 100KB response becomes ~20KB.
    # Faster for mobile clients. Lower bandwidth cost.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json text/plain application/xml;

    # ── Security headers ─────────────────────────────────
    # Applied to every response from this server.
    # X-Frame-Options DENY = prevents your API being
    # loaded inside an iframe on another website.
    # X-Content-Type-Options nosniff = prevents browser
    # from guessing content type — must use what server says.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ── Timeouts ─────────────────────────────────────────
    # How long Nginx waits for auth-service to respond.
    # connect = time to establish connection to upstream.
    # read = time to wait for upstream to send response.
    # OTP sending via Twilio/Resend can take a few seconds
    # so 60s read timeout is intentionally generous.
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # ── Proxy headers ────────────────────────────────────
    # These tell Spring Boot the real client information.
    # Without these, Spring Boot sees Nginx as the client.
    # Every request would appear to come from Nginx's IP.
    # Your audit logs, IP based logic would all be wrong.
    #
    # Host = original host header from client request
    # X-Real-IP = actual client IP address
    # X-Forwarded-For = chain of IPs request passed through
    # X-Forwarded-Proto = original protocol (http or https)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";


    # ── Strict rate limited endpoints ────────────────────

    # Login — attacker target for password brute force
    # burst=10 = allow short spike of 10 requests above limit
    # nodelay = reject immediately when burst is exceeded,
    # do not queue requests and make clients wait
    location = /api/auth/user/login {
        limit_req zone=strict burst=10 nodelay;
        proxy_pass http://auth_service;
    }

    # OTP verify — attacker target for OTP brute force
    # Only 1,000,000 combinations in a 6 digit OTP.
    # Without this, automated script cracks it in seconds.
    location = /api/auth/user/register/otp/verify {
        limit_req zone=strict burst=5 nodelay;
        proxy_pass http://auth_service;
    }

    # Reset password verify — same risk as OTP
    location = /api/auth/user/reset-password/verify {
        limit_req zone=strict burst=5 nodelay;
        proxy_pass http://auth_service;
    }


    # ── Normal rate limited endpoints ────────────────────

    # All auth routes — register, refresh, logout, Google OAuth
    location /api/auth/ {
        limit_req zone=normal burst=60 nodelay;
        proxy_pass http://auth_service;
    }

    # Admin routes
    location /api/admin/ {
        limit_req zone=normal burst=60 nodelay;
        proxy_pass http://auth_service;
    }

    # User routes
    location /api/users/ {
        limit_req zone=normal burst=60 nodelay;
        proxy_pass http://auth_service;
    }


    # ── Actuator ─────────────────────────────────────────
    # Spring Boot health and metrics endpoints.
    # Used by Docker health checks and monitoring.
    # Tighter rate limit — no normal user should be
    # hitting actuator endpoints repeatedly.
    location /actuator/ {
        limit_req zone=normal burst=20 nodelay;
        proxy_pass http://auth_service;
    }


    # ── Health check ─────────────────────────────────────
    # Nginx responds to this directly without hitting
    # auth-service at all. Used by AWS ALB to check if
    # this EC2 instance is alive.
    # access_log off = do not log these — ALB hits this
    # every 30 seconds, would flood your logs with noise.
    location /health {
        access_log off;
        return 200 'healthy\n';
        add_header Content-Type text/plain;
    }


    # ── Reject everything else ────────────────────────────
    # Any path not matched above returns 404.
    # Prevents accidentally exposing unintended endpoints.
    location / {
        return 404 '{"error":"not found"}';
        add_header Content-Type application/json;
    }
}
